# ──────────────────────────────────────────────────────────────────────────────
# config.yaml — AI Robotic Arm Configuration
# Edit this file to tune the system without touching source code.
# ──────────────────────────────────────────────────────────────────────────────

camera:
  device_id: 0
  width:  1280
  height: 720
  fps:    30

yolo:
  # Path to your custom-trained model (set after training)
  model_path: models/yolo/best.pt
  fallback_model: yolov8n.pt
  confidence_threshold: 0.45
  iou_threshold: 0.45
  input_size: 640
  target_classes:
    - cup
    - bottle
    - book
    - cell phone
    - scissors
    - remote
    - keyboard
    - mouse
    - apple
    - orange

robotics:
  serial_port: COM3        # Change to /dev/ttyUSB0 on Linux/Mac
  baud_rate:   115200
  timeout:     1.0

  # 4-DOF link lengths (metres) — measure your physical arm
  l1: 0.105   # base to shoulder
  l2: 0.105   # upper arm
  l3: 0.090   # forearm
  l4: 0.060   # wrist to gripper tip

  move_speed: 50
  home_speed: 30

depth:
  enabled: false          # Set to true when you have depth hardware / MiDaS
  method:  monocular      # monocular | stereo | realsense
  monocular_model: MiDaS_small
  alpha: 1200.0
  beta:  -0.05

# ───────────────────────────────────────────────────────────────────────────────
# SECTION: Segmentation (Path 1 — Advanced AI Vision)
# ───────────────────────────────────────────────────────────────────────────────
segmentation:
  enabled: true               # Use InstanceSegmentor instead of ObjectDetector
  model_path: models/yolo/best-seg.pt  # Custom seg model (optional)
  fallback_model: yolov8n-seg.pt       # Auto-download if custom not found
  frame_skip: 3               # Run seg every N frames (heavier than detection)
  min_mask_area_px: 1500      # Ignore tiny masks (noise)

grasp_pose:
  min_confidence: 0.30        # Drop GraspPose below this confidence
  depth_std_thresh: 0.08      # Max depth noise (m) before lowering confidence

# ───────────────────────────────────────────────────────────────────────────────
# SECTION: Path Planning (Path 2 — Advanced Robotics)
# ───────────────────────────────────────────────────────────────────────────────
path_planning:
  enabled: true               # Use RRT* instead of direct IK → trajectory
  max_iterations: 2000        # RRT* tree growth limit
  step_size_m: 0.025          # Extension step (metres)
  goal_bias: 0.15             # Probability of sampling goal directly
  rewire_radius_m: 0.08       # RRT* neighbour rewire radius
  smooth_path: true           # Apply greedy shortcutting after RRT*

# ───────────────────────────────────────────────────────────────────────────────
# SECTION: Visual Servoing (Path 2 — Closed-Loop Control)
# ───────────────────────────────────────────────────────────────────────────────
visual_servo:
  enabled: false              # Set to true to enable closed-loop approach
  pixel_tolerance: 8          # Convergence threshold (pixels)
  area_tolerance: 500         # Convergence threshold (px² area error)
  max_iterations: 120         # Max servo loop iterations before timeout
  kp_x: 0.0004               # PID gains (lateral X)
  ki_x: 0.00005
  kd_x: 0.0001
  kp_y: 0.0004               # PID gains (lateral Y)
  ki_y: 0.00005
  kd_y: 0.0001
  kp_z: 0.0002               # PID gains (depth via area)
  ki_z: 0.00002
  kd_z: 0.00005
  desired_area_px: 15000      # Target object area at pick height

# ───────────────────────────────────────────────────────────────────────────────
# SECTION: Quality Control (Path 3 — Advanced Intelligence)
# ───────────────────────────────────────────────────────────────────────────────
quality_control:
  enabled: true               # Run QC inspection before every pick
  defect_threshold: 0.55      # Score above this → reject
  ml_model_path: models/qc/defect_classifier.onnx   # Optional ML model
  laplacian_low_thresh: 15.0  # Texture variance below this → suspicious
  colour_std_thresh: 45.0     # HSV std-dev above this → suspicious
  solidity_low_thresh: 0.82   # Mask solidity below this → dented/broken
  reject_zone_xyz: [0.00, 0.35, 0.05]  # Reject bin position (m)

# ───────────────────────────────────────────────────────────────────────────────
# SECTION: Input Shaping / Pulse Shaping  (Stages 1 → 3)
# ───────────────────────────────────────────────────────────────────────────────
input_shaping:

  # ── Stage 1: Trajectory profile ──────────────────────────────────────────────
  # planner choices: s_curve | jerk_limited | cubic | trapezoidal
  planner:   s_curve      # s_curve is the recommended default (full 7-phase)
  profile:   quintic      # jerk_limited sub-profile: quintic | sigmoid | cubic
  max_vel:   120.0        # max joint velocity    (deg/s)
  max_acc:   200.0        # max joint acceleration (deg/s²)
  max_jerk:  800.0        # max joint jerk         (deg/s³) — s_curve only

  # ── Stage 2: Classical input shaping (ZV / ZVD / EI) ─────────────────────────
  # shaper_kind choices: zv | zvd | ei | none
  shaper_kind: zvd        # ZVD is more robust than ZV to ωₙ uncertainty

  # Natural frequency of the arm's dominant vibration mode.
  # Measure by tapping the arm end-effector and counting oscillations, or run:
  #   python -m scripts.measure_resonance
  # Typical hobby 4-DOF arm: 12–25 rad/s (≈ 2–4 Hz)
  omega_n: 18.0           # rad/s  ← TUNE THIS for your arm

  # Damping ratio (0 = undamped, 1 = critically damped).
  # Start at 0.10 and adjust based on free-oscillation decay.
  zeta: 0.10              # dimensionless  ← TUNE THIS for your arm

  # ── Stage 3: AI adaptive shaping ─────────────────────────────────────────────
  # Requires IMU on the arm end-effector wired through firmware telemetry.
  # When enabled, the ResonanceEstimator continuously updates ωₙ and ζ.
  adaptive:        false  # set to true when IMU firmware is ready
  estimator_kind:  kalman # kalman (best) | rls | fft
  imu_sample_rate: 200.0  # Hz — must match firmware IMU output rate

log_level:   INFO
debug_video: true         # Show annotated camera feed
dry_run:     false        # true = skip all serial commands (safe for dev)
